[package]
authors = [
    "PatWie <mail@patwie.com>",
    "Michael Johnson <mjohnson459@gmail.com>",
]
description = "A pure Rust implementation of the Robot Operating System (ROS) core."
license = "MIT"
name = "ros-core-rs"
readme = "README.md"
repository = "https://github.com/patwie/ros-core-rs"
homepage = "https://github.com/patwie/ros-core-rs"
version = "0.2.4"
edition = "2021"
keywords = ["ros", "rosrust", "roscore", "robotics"]
categories = ["science::robotics"]

[workspace]
members = ["crates/log_replay"]

[dependencies]
dxr = "0.7.1"
dxr_server = { version = "0.7.1", features = ["axum", "multicall"] }
dxr_client = { version = "0.7.1", default-features = false, features = [
    "reqwest",
    "rustls-tls", # Use rustls instead of openssl for easier cross-compilation
] }
anyhow = "1.0.98"
log = "0.4.27"
env_logger = "0.10.2"
chrono = { version = "0.4.41", features = ["serde"] }
paste = "1.0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2.5.4"
maplit = "1.0.2"
clap = { version = "4.0", features = ["derive"] }
hostname = "0.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "7.0.0-rc2"

# Tracing
tower-http = { version = "0.6.6", features = ["trace"], optional = true }
tracing = { version = "0.1.40", optional = true }
tracing-subscriber = { version = "0.3.19", features = [
    "env-filter",
], optional = true }
tracing-tracy = { version = "0.11.4", optional = true }

[dev-dependencies]
doc-comment = "0.3.3"
tokio = { version = "1", features = ["signal"] }
tokio-util = "0.7.15"
criterion = "0.6"

[features]
doctest = []
tracing = ["tower-http", "dep:tracing", "tracing-subscriber", "tracing-tracy"]

[[bench]]
name = "param_tree"
harness = false

[[bin]]
name = "rustmaster"
path = "src/main.rs"
